EXPERIMENT:
  NAME: "sfwsupcon_res32x4_resnet8x4"
  TAG:  "cifar100"

DATASET:
  TYPE: "cifar100"
  NUM_WORKERS: 2

DISTILLER:
  TYPE: "SFWSupCon"
  TEACHER: "resnet32x4"
  STUDENT: "resnet8x4"

SFWSupCon:
  alpha:         1.0
  beta:          10.0
  temperature:   0.07
  proj_dim:      64
  bank_size:     4096      # set 0 to disable memory bank
  bank_momentum: 0.5
  adaptive_beta: true
  ce_weight:     1.0
  kd_weight:     1.0
  aux_weight:    0.5
  kd_warmup_epochs:  10

SOLVER:
  TYPE: "SGD"
  TRAINER: "SFWSupCon"
  LR: 0.05
  LR_DECAY_STAGES: [150, 180, 210]
  LR_DECAY_RATE: 0.1
  WEIGHT_DECAY: 5.0e-4
  MOMENTUM: 0.9
  EPOCHS: 240
  BATCH_SIZE: 128
  